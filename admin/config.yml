# =============================================
# DECAP CMS - VI COOL TAPAS BAR
# =============================================

backend:
  name: git-gateway
  branch: main

local_backend: true
media_folder: "img/uploads"
public_folder: "/img/uploads"

i18n:
  structure: multiple_files
  locales: [es, en]
  default_locale: es

# =============================================
# COLECCIONES
# =============================================
collections:

  # -----------------------------------------
  # 1. PÁGINA DE INICIO
  # -----------------------------------------
  - name: "inicio"
    label: "🏠 Página de Inicio"
    label_singular: "Inicio"
    description: "Edita la imagen principal, textos y datos de contacto de la página de inicio."
    files:
      - name: "inicio"
        label: "Contenido de Inicio"
        file: "content/inicio.json"
        format: "json"
        i18n: true
        editor:
          preview: true
        fields:
          - label: "🖼️ Imagen Principal (Hero)"
            name: "hero_imagen"
            widget: "image"
            required: true
            i18n: true
            hint: "Foto grande de portada. Recomendado: 1920x1080px"

          - label: "Título Principal"
            name: "hero_titulo"
            widget: "string"
            required: true
            i18n: true
            default: "Tapas-Raciones de Temporada"

          - label: "Subtítulo"
            name: "hero_subtitulo"
            widget: "string"
            required: true
            i18n: true
            default: "Una experiencia culinaria inolvidable en el corazón de Madrid"

          - label: "Texto del Botón"
            name: "hero_cta"
            widget: "string"
            required: true
            i18n: true
            default: "Reserva tu mesa"

          - label: "Título Filosofía"
            name: "filosofia_titulo"
            widget: "string"
            required: true
            i18n: true
            default: "Respetando el producto de temporada"

          - label: "Texto Filosofía"
            name: "filosofia_texto"
            widget: "text"
            required: true
            i18n: true
            default: "Respetando el producto de temporada y trabajando con la máxima calidad, ofrecemos nuestras tapas-raciones para disfrutar de una experiencia culinaria inolvidable."

          - label: "Dirección"
            name: "direccion"
            widget: "string"
            required: true
            i18n: true
            default: "VI COOL TAPAS BAR, C/ Huertas, 12, 28012 Madrid"

          - label: "Teléfono (visual)"
            name: "telefono"
            widget: "string"
            required: true
            i18n: true
            default: "914 294 913"

          - label: "Teléfono (link)"
            name: "telefono_link"
            widget: "string"
            required: true
            i18n: true
            default: "+34914294913"
            hint: "Solo números y +, sin espacios"

          - label: "Horario"
            name: "horario"
            widget: "string"
            required: true
            i18n: true
            default: "Lun - Dom: 13:00 - 16:00 / 20:00 - 23:30"

          - label: "Email"
            name: "email"
            widget: "string"
            required: true
            i18n: true
            default: "info@vicooltapasbar.es"

  # -----------------------------------------
  # 2. CARTA
  # -----------------------------------------
  - name: "carta"
    label: "🍽️ Carta del Restaurante"
    label_singular: "Plato"
    description: "Añade, edita o elimina platos de la carta."
    folder: "content/carta"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}} - {{precio}}€ ({{categoria}})"
    i18n: true
    sortable_fields: ["title", "precio", "categoria"]
    editor:
      preview: true
    fields:
      - label: "Nombre del Plato"
        name: "title"
        widget: "string"
        required: true
        i18n: true

      - label: "Precio (€)"
        name: "precio"
        widget: "number"
        required: true
        i18n: true
        value_type: "float"
        min: 0
        step: 0.5
        hint: "Solo número. Ej: 8.5 para 8,50€"

      - label: "Descripción"
        name: "descripcion"
        widget: "text"
        required: true
        i18n: true
        hint: "Breve descripción del plato o ingredientes"

      - label: "Categoría"
        name: "categoria"
        widget: "select"
        required: true
        i18n: true
        options:
          - { label: "Tapas Raciones", value: "tapas-raciones" }
          - { label: "Menú del Día", value: "menu-dia" }
          - { label: "Postres", value: "postres" }
          - { label: "Vinos", value: "vinos" }
          - { label: "Bebidas", value: "bebidas" }
        default: "tapas-raciones"

      - label: "Alérgenos"
        name: "alergenos"
        widget: "select"
        required: false
        i18n: true
        multiple: true
        options:
          - { label: "Gluten", value: "gluten" }
          - { label: "Lactosa", value: "lactosa" }
          - { label: "Huevo", value: "huevo" }
          - { label: "Frutos Secos", value: "frutos-secos" }
          - { label: "Marisco", value: "marisco" }
          - { label: "Pescado", value: "pescado" }
          - { label: "Soja", value: "soja" }

      - label: "Foto del Plato"
        name: "foto"
        widget: "image"
        required: false
        i18n: true
        hint: "Recomendado: 600x400px"

      - label: "⭐ Plato Destacado"
        name: "destacado"
        widget: "boolean"
        required: false
        i18n: true
        default: false
        hint: "Resalta este plato con etiqueta especial"

      - label: "🚫 Agotado (ocultar)"
        name: "agotado"
        widget: "boolean"
        required: false
        i18n: true
        default: false
        hint: "Oculta temporalmente sin borrar"

  # -----------------------------------------
  # 3. EVENTOS
  # -----------------------------------------
  - name: "eventos"
    label: "🎉 Eventos"
    label_singular: "Evento"
    description: "Crea eventos especiales. Solo se muestran los futuros."
    folder: "content/eventos"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}} ({{fecha}})"
    i18n: true
    sortable_fields: ["title", "fecha"]
    editor:
      preview: true
    fields:
      - label: "Nombre del Evento"
        name: "title"
        widget: "string"
        required: true
        i18n: true

      - label: "📅 Fecha y Hora"
        name: "fecha"
        widget: "datetime"
        required: true
        i18n: true
        date_format: "DD/MM/YYYY"
        time_format: "HH:mm"
        format: "YYYY-MM-DDTHH:mm:ss"

      - label: "📍 Lugar"
        name: "ubicacion"
        widget: "string"
        required: false
        i18n: true
        default: "Vi-Cool Tapas Bar, C/ Huertas 12"

      - label: "📝 Descripción"
        name: "descripcion"
        widget: "text"
        required: true
        i18n: true

      - label: "📷 Imagen del Evento"
        name: "imagen"
        widget: "image"
        required: false
        i18n: true
        hint: "Recomendado: 800x500px"

      - label: "🔗 Enlace de Reserva"
        name: "enlace_reserva"
        widget: "string"
        required: false
        i18n: true
        hint: "URL para reservar plaza"

      - label: "👥 Aforo"
        name: "aforo"
        widget: "number"
        required: false
        i18n: true
        value_type: "int"
        min: 1
        hint: "Plazas máximas (opcional)"

  # -----------------------------------------
  # 4. GALERÍA
  # -----------------------------------------
  - name: "galeria"
    label: "📸 Galería de Fotos"
    label_singular: "Foto"
    description: "Sube fotos del local. Se muestran en la sección Galería."
    folder: "content/galeria"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}}"
    i18n: true
    editor:
      preview: true
    fields:
      - label: "Título"
        name: "title"
        widget: "string"
        required: true
        i18n: true
        hint: "Ej: Vista del interior, Croquetas..."

      - label: "📷 Fotografía"
        name: "imagen"
        widget: "image"
        required: true
        i18n: true
        hint: "Recomendado: 800x600px o más grande"

      - label: "Categoría"
        name: "categoria"
        widget: "select"
        required: false
        i18n: true
        options:
          - { label: "El Local", value: "local" }
          - { label: "Platos", value: "platos" }
          - { label: "Eventos", value: "eventos" }
        default: "local"
