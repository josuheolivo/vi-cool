<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - Vi-Cool Tapas Bar</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; padding: 2rem; background: #1a1a1a; color: #fff; text-align: center; }
        .loading { display: flex; align-items: center; justify-content: center; min-height: 100vh; flex-direction: column; gap: 1rem; }
        .loading__spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.2); border-top-color: #8B1A1A; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading__text { font-size: 0.875rem; color: rgba(255,255,255,0.6); }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="loading__spinner"></div>
        <p class="loading__text">Cargando panel de administración...</p>
    </div>

    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on('init', function(user) {
                if (!user) {
                    window.netlifyIdentity.on('login', function() {
                        document.location.href = '/admin/';
                    });
                }
            });
        }
    </script>
</body>
</html>
